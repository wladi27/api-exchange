<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolar API SaaS · Documentación Oficial OpenAPI 3.1</title>
  <meta name="description" content="Documentación interactiva de la API comercial de tipo de cambio BCV con soporte para Pago Móvil, Binance Pay, SDK para NPM y alta disponibilidad.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #f0f6fc;
    }
    .custom-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-bottom: 1px solid #334155;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .header-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .header-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .header-link:hover {
      color: #ffffff;
    }
    .cta-button {
      background: #2563eb;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta-button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header class="custom-header">
    <div class="logo-container">
      <span style="font-size: 24px;">💵</span>
      <div>
        <h1 style="margin: 0; font-size: 18px; font-weight: 700; color: #ffffff;">Dolar API · BCV Enterprise</h1>
      </div>
      <span class="badge"><span class="badge-dot"></span> API Operacional</span>
    </div>
    <div class="header-links">
      <a href="/docs/openapi.json" target="_blank" class="header-link">📄 OpenAPI Spec</a>
      <a href="/api/v1/billing/payment-methods" target="_blank" class="header-link">💳 Planes & Pago Móvil / Binance</a>
      <a href="#quickstart" class="cta-button">📦 Instalar SDK NPM</a>
    </div>
  </header>

  <!-- Scalar API Reference Container -->
  <div id="api-reference" data-url="/docs/openapi.json"></div>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    document.getElementById('api-reference').setAttribute('data-configuration', JSON.stringify({
      theme: 'deepSpace',
      layout: 'modern',
      showSidebar: true,
      defaultHttpClient: {
        targetKey: 'js',
        clientKey: 'fetch'
      }
    }));
  </script>
</body>
</html>
